name: Build Production ERPNext Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to publish"
        required: true
        default: "v2"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout frappe_docker
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          ref: main
          path: frappe_docker

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create apps.json
        run: |
          cat > frappe_docker/apps.json <<'EOF'
          [
            {
              "url": "https://github.com/frappe/erpnext",
              "branch": "version-15"
            },
            {
              "url": "https://github.com/frappe/hrms",
              "branch": "version-15"
            },
            {
              "url": "https://github.com/CM-Torrejos/cardmasters_app",
              "branch": "v1.0.0"
            },
            {
              "url": "https://github.com/frappe/insights",
              "branch": "version-3"
            },
            {
              "url": "https://github.com/The-Commit-Company/raven",
              "branch": "main"
            }
          ]
          EOF

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./frappe_docker
          file: ./frappe_docker/images/custom/Containerfile
          push: true
          no-cache: true
          tags: ghcr.io/cm-torrejos/marcommax-production:${{ inputs.image_tag }}
          secret-files: |
            apps_json=./frappe_docker/apps.json
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-15
            PYTHON_VERSION=3.11.9
            NODE_VERSION=18.20.2
            CACHE_BUST=${{ github.run_id }}

      - name: Show image
        run: |
          echo "Published image:"
          echo "ghcr.io/cm-torrejos/marcommax-production:${{ inputs.image_tag }}"
